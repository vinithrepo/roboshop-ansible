- name: copy mongo repo
  ansible.builtin.copy:
    src: mongo.repo
    dest: /etc/yum.repos.d/mongo.repo

- name: Install mongodb Client
  ansible.builtin.yum:
    name: mongodb-org-shell
    state: installed

- name: load schema
  ansible.builtin.shell: mongo --ssl --host {{ lookup('amazon.aws.aws_ssm' , 'docdb.{{env}}.endpoint', region='us-east-1') }}:27017 --tlsCAFile global-bundle.pem  --username docdbadmin --password roboshop123 </app/schema/{{component}}.js
