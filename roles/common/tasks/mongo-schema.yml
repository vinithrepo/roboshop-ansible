- name: copy mongo repo
  ansible.builtin.copy:
    src: mongo.repo
    dest: /etc/yum.repos.d/mongo.repo

- name: Install mongodb Client
  ansible.builtin.yum:
    name: mongodb-org-shell
    state: installed

- name: Download Docdb pem file
  ansible.builtin.get_url:
    url: https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem
    dest: /app/rds-combined-ca-bundle.pem   # cat /app/server.js

- name: load schema
  ansible.builtin.shell: mongo --ssl --host {{ lookup('amazon.aws.aws_ssm' , 'docdb.{{env}}.endpoint', region='us-east-1') }}:27017 --tlsCAFile /app/rds-combined-ca-bundle.pem  --username docdbadmin --password roboshop123 </app/schema/{{component}}.js
